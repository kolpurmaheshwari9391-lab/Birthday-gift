```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e54e9);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
      padding: 35px 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      position: relative;
      z-index: 5;
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.5s infinite;
    }

    h1 {
      font-size: clamp(2.2rem, 10vw, 4rem);
      margin: 10px 0;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    h2 {
      font-size: clamp(1.3rem, 6vw, 2rem);
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .heart {
      font-size: 30px;
      animation: heartbeat 1s infinite;
    }

    button {
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      background: white;
      color: #e84393;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.08);
    }

    /* Balloons */
    .balloon {
      position: absolute;
      bottom: -120px;
      font-size: 60px;
      animation: float 7s linear infinite;
      z-index: 1;
    }

    .b1 { left: 5%; animation-delay: 0s; }
    .b2 { left: 25%; animation-delay: 2s; }
    .b3 { right: 20%; animation-delay: 1s; }
    .b4 { right: 5%; animation-delay: 3s; }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(-5deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-120vh) rotate(10deg);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.3);
      }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 9px;
      height: 14px;
      top: -20px;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 18px;
      }

      .cake {
        font-size: 60px;
      }

      p {
        font-size: 0.95rem;
      }

      button {
        width: 80%;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <!-- Birthday Card -->
  <div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <!-- Change the name here -->
    <h2>🎉 Dear <span id="name">Friend</span> 🎉</h2>

    <p>
      Wishing you a beautiful birthday filled with
      happiness, laughter, love and unforgettable moments! 💖
    </p>

    <div class="heart">💗</div>

    <br>

    <button onclick="celebrate()">
      🎉 Celebrate!
    </button>

  </div>

  <script>

    // Change the birthday person's name
    const birthdayName = "Friend";

    document.getElementById("name").textContent = birthdayName;

    function createConfetti() {

      const confetti = document.createElement("div");

      confetti.classList.add("confetti");

      confetti.style.left = Math.random() * 100 + "vw";

      confetti.style.backgroundColor =
        `hsl(${Math.random() * 360}, 100%, 60%)`;

      confetti.style.animationDuration =
        (Math.random() * 3 + 2) + "s";

      confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 5000);
    }

    // Continuous confetti
    setInterval(createConfetti, 120);

    // Extra celebration when button is clicked
    function celebrate() {

      for (let i = 0; i < 100; i++) {
        setTimeout(createConfetti, i * 20);
      }

      alert("🎉 Happy Birthday! 🎂🥳");
    }

  </script>

</body>
</html>
